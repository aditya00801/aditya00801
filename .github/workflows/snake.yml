name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aditya00801
          outputs: |
            dist/github-snake.svg?color_snake=#0f766e&color_dots=#ebedf0,#99f6e4,#2dd4bf,#0d9488,#115e59
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#99f6e4&color_dots=#10393d,#115e59,#0d9488,#2dd4bf,#99f6e4

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
