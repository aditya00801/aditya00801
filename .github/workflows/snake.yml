name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aditya00801
          outputs: |
            dist/github-snake.svg?color_snake=#2E3D28&color_dots=#DFE2D5,#C3CCAA,#A9B887,#718064,#46523F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E8E9DF&color_dots=#1F2A1C,#46523F,#718064,#A9B887,#C3CCAA

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
