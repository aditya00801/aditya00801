<svg xmlns="http://www.w3.org/2000/svg" width="840" height="288" viewBox="0 0 840 288" role="img" aria-label="Aditya Kushwaha: building useful things with intelligent software. Open to internships and early-career roles."><defs><pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#2E3D28" opacity=".13"/></pattern></defs><style>@keyframes f{50%{transform:translateY(-7px)}}.float{animation:f 7s ease-in-out infinite}@keyframes o{to{stroke-dashoffset:-220}}.orbit{animation:o 18s linear infinite}@keyframes l{50%{opacity:.3}}.light{animation:l 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="7" y="7" width="832" height="280" fill="#2E3D28"/><rect x="1" y="1" width="832" height="280" fill="#E8E9DF" stroke="#2E3D28"/><rect x="1" y="1" width="832" height="280" fill="url(#dots)"/><circle class="light" cx="32" cy="29" r="4" fill="#536448"/><text x="44" y="33" font-family="'Courier New',Courier,monospace" font-size="11" fill="#536448" font-weight="400" text-anchor="start" >PERSONAL PROFILE / 2026</text><text x="806" y="33" font-family="'Courier New',Courier,monospace" font-size="11" fill="#536448" font-weight="400" text-anchor="end" >LUCKNOW, INDIA ✳</text><line x1="28" y1="48" x2="806" y2="48" stroke="#B7BEA9"/><text x="28" y="84" font-family="'Courier New',Courier,monospace" font-size="12" fill="#536448" font-weight="700" text-anchor="start" letter-spacing="1.2">ADITYA KUSHWAHA — COMPUTER SCIENCE / AI</text><text x="28" y="138" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#2E3D28" font-weight="500" text-anchor="start" letter-spacing="-1.8">Building useful things with</text><text x="28" y="188" font-family="Georgia,'Times New Roman',serif" font-size="44" fill="#2E3D28" font-weight="400" text-anchor="start" font-style="italic" letter-spacing="-1.8">intelligent software.</text><text x="28" y="224" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#46523F" font-weight="400" text-anchor="start" >Machine learning, agentic AI, and the software that brings them into the real world.</text><rect x="28" y="250" width="8" height="8" fill="#2E3D28"/><text x="44" y="258" font-family="'Courier New',Courier,monospace" font-size="12" fill="#536448" font-weight="700" text-anchor="start" >OPEN TO INTERNSHIPS &amp; EARLY-CAREER ROLES</text><ellipse class="orbit" cx="704" cy="134" rx="104" ry="52" fill="none" stroke="#536448" stroke-dasharray="5 6"/><g class="float"><rect x="672" y="102" width="82" height="82" fill="#2E3D28"/><rect x="664" y="94" width="82" height="82" fill="#A9B887" stroke="#2E3D28"/><text x="705" y="139" font-family="'Courier New',Courier,monospace" font-size="28" fill="#2E3D28" font-weight="900" text-anchor="middle" >AK.</text><text x="705" y="160" font-family="'Courier New',Courier,monospace" font-size="10" fill="#2E3D28" font-weight="700" text-anchor="middle" >AI / SWE</text></g></svg>
